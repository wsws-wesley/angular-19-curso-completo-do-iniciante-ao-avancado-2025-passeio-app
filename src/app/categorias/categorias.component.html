<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6 mb-4">
	<h2 class="text-2x1 font-semibold text-gray-700 mb-4">
		Nova categoria
	</h2>

	<form 
		id="categoryForm" 
		[formGroup]="categoryForm!" 
		(ngSubmit)="save()">
		<div class="mb-4">
			<label 
				class="block text-gray-600 font-medium mb-1"
				for="name">Nome</label>
			<input
				class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-sky-400 mb-1"
				formControlName="name"
				id="name"
				name="name"
				placeholder="Restaurantes, Praias, Shoppings..."
				required
				type="text"/>
			
			@if (isInvalidField('name')) {
				<span class="text-red-500 text-sm" >
					O nome da categoria deve ser informado!
				</span>
			}
		</div>

		<div class="mb-4">
			<label 
				class="block text-gray-600 font-medium mb-1"
				for="description">Descrição</label>
			<textarea
				class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-sky-400"
				formControlName="description"
				id="description"
				name="description"
				placeholder="Restaurantes, praias, Shoppings..."
				required
				rows="4">
			</textarea>

			@if (isInvalidField('description')) {
				<span class="text-red-500 text-sm">
					A descrição da categoria deve ser informada!
				</span>
			}
		</div>

		<button 
			class="w-full bg-gradient-to-r from-sky-800 via-sky-700 to-sky-800 text-white font-semibold p-3 rounded shadow hover:opacity-90"
			type="submit">
			Cadastrar categoria
		</button>
	</form>
</div>
