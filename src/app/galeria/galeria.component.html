<form id="filterForm" 
	[formGroup]="filterForm"
	(ngSubmit)="filterLocations()">
	<div class="p-4 bg-white shadow rounded mt-6">
		<div class="flex flex-col md:flex-row items-center justify-center rounded">
			<input
				class="w-full md:mr-4 p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-sky-400"
				formControlName="name"
				id="searchFilter"
				name="searchFilter"
				placeholder="Pesquisar..." 
				type="text"/>

			<select 
				class="w-full mt-4 md:mt-0 md:mr-4 p-3 bg-white border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-sky-400 appearance-none"
				formControlName="category"
				id="categoryFilter"
				name="categoryFilter">
				<option value="">Selecione...</option>

				@for (categoria of categorias; track $index) {
					<option [value]="categoria.name">{{ categoria.name }}</option>
				}
			</select>

			<button 
				class="mt-4 md:mt-0 w-full md:w-auto bg-gradient-to-r from-sky-800 via-sky-700 to-sky-800 text-white font-semibold py-3 px-9 rounded shadow hover:opacity-90"
				type="submit">
				Pesquisar
			</button>
		</div>
	</div>
</form>

<div class="py-4 grid grid-col-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
	@for (local of locais; track $index) {
		<div class="bg-white shadow rounded overflow-hidden">
			<div class="w-full h-40 overflow-hidden rounded">
				<img
					class="w-full h-full object-cover transition-transform duration-300 hover:scale-110 cursor-pointer"
					[alt]="local.name"
					[src]="local.photoUrl"
					(click)="navigateToLocalForm(local.id)"
				/>
			</div>
			
			<div class="p-4 font-semibold">
				<h2 class="text-lg mb-2">{{ local.name }}</h2>
				<p class="text-sm text-gray-700 mb-2">
					Categoria: {{ local.category }}
				</p>
				<p class="text-sm text-gray-700 mb-2">
					Localização: {{ local.location }}
				</p>
				<p class="text-sm text-gray-700">
					Avaliação: <span class="text-yellow-500" [innerHTML]="getRatingStars(local.rating)"></span>
				</p>
			</div>
		</div>
	}
</div>
